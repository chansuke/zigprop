\* P4's lateral move with the decrease check. AcceptsBoundedByMeasure:
\* at most (MaxRank + 1) * (MaxNC + 1) - 1 = 11 acceptances, independently
\* of the budget. MaxBudget = 16 leaves room for more than 11, so the
\* budget alone does not make the bound hold.
CONSTANTS
    MaxRank = 3
    Failing = {0, 1, 2, 3}
    MaxBudget = 16
    MaxCases = 1
    MaxDiscards = 0
    MaxNC = 2
    RatchetChecksDecrease = TRUE

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT BestAlwaysFails
INVARIANT BestOnlyAfterFailure
INVARIANT OutcomeConsistency
INVARIANT AcceptsBoundedByMeasure

PROPERTY Termination
