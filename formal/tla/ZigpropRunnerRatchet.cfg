\* P4's lateral move with the decrease check. The measure bound is
\* (MaxRank + 1) * (MaxNC + 1) - 1 = 11 acceptances, and MaxBudget = 16
\* is above it, so the budget never stops shrinking first.
CONSTANTS
    MaxRank = 3
    Failing = {0, 1, 2, 3}
    MaxBudget = 16
    MaxCases = 1
    MaxDiscards = 0
    MaxNC = 2
    RatchetChecksDecrease = TRUE

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT BestAlwaysFails
INVARIANT BestOnlyAfterFailure
INVARIANT OutcomeConsistency
INVARIANT AcceptsBoundedByMeasure

PROPERTY Termination
