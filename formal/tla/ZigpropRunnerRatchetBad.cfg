\* Expected to FAIL: ZigpropRunnerRatchet.cfg without the decrease check.
\* TLC must report that AcceptsBoundedByMeasure is violated (repeated
\* lateral moves at the same rank and nc); see formal/tla/README.md.
CONSTANTS
    MaxRank = 3
    Failing = {0, 1, 2, 3}
    MaxBudget = 16
    MaxCases = 1
    MaxDiscards = 0
    MaxNC = 2
    RatchetChecksDecrease = FALSE

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT BestAlwaysFails
INVARIANT BestOnlyAfterFailure
INVARIANT OutcomeConsistency
INVARIANT AcceptsBoundedByMeasure

PROPERTY Termination
