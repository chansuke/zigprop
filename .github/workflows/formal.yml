name: Formal verification

on:
  push:
    branches: [main]
    paths:
      - "formal/**"
      - "src/**"
      - "docs/verification.md"
      - ".github/workflows/formal.yml"
  pull_request:
    paths:
      - "formal/**"
      - "src/**"
      - "docs/verification.md"
      - ".github/workflows/formal.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit to check out; empty checks out the triggering commit"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  lean:
    name: Lean proofs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - name: Build Lean model
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          lake-package-directory: formal/lean
      - name: Axiom audit (no sorryAx in key theorems)
        working-directory: formal/lean
        run: ./check-axioms.sh
      - name: Reject sorry / admit (auxiliary check)
        run: |
          if grep -rn --include='*.lean' -E '\b(sorry|admit)\b' formal/lean/ZigpropFormal formal/lean/ZigpropFormal.lean; then
            echo "sorry/admit found in Lean proofs" >&2
            exit 1
          fi

  tla:
    name: TLA+ model checking (TLC)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch tla2tools (checksum-pinned)
        run: |
          curl -fsSL -o /tmp/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          echo "67f9575c3b9ef7a0787b1bded34812862ffe79d711298e5a75b1a77720b19928  /tmp/tla2tools.jar" \
            | sha256sum -c -
      - name: Run TLC (all configurations)
        working-directory: formal/tla
        shell: bash
        run: |
          set -euo pipefail
          for cfg in ZigpropRunner.cfg ZigpropRunnerEmpty.cfg ZigpropRunnerZero.cfg ZigpropRunnerNoDiscard.cfg ZigpropRunnerRatchet.cfg; do
            echo "== $cfg"
            java -jar /tmp/tla2tools.jar -config "$cfg" ZigpropRunner.tla \
              | tee "/tmp/tlc-$cfg.out"
            grep -q "Model checking completed. No error has been found." "/tmp/tlc-$cfg.out"
          done
      - name: Run TLC (ZigpropRunnerRatchetBad.cfg must violate AcceptsBoundedByMeasure)
        working-directory: formal/tla
        shell: bash
        run: |
          set -euo pipefail
          # TLC exits non-zero on the expected violation; the greps decide.
          java -jar /tmp/tla2tools.jar -config ZigpropRunnerRatchetBad.cfg ZigpropRunner.tla \
            > /tmp/tlc-ratchet-bad.out 2>&1 || true
          cat /tmp/tlc-ratchet-bad.out
          grep -q "Error: Invariant AcceptsBoundedByMeasure is violated." /tmp/tlc-ratchet-bad.out
          if grep -q "Model checking completed. No error has been found." /tmp/tlc-ratchet-bad.out; then
            echo "ZigpropRunnerRatchetBad.cfg was expected to violate AcceptsBoundedByMeasure" >&2
            exit 1
          fi
      - name: Run TLC (ZigpropRunnerRatchetTight.cfg must violate AcceptsBelowMeasureBound)
        working-directory: formal/tla
        shell: bash
        run: |
          set -euo pipefail
          # The violation shows 11 acceptances are reachable, so the bound
          # checked by ZigpropRunnerRatchet.cfg is tight.
          java -jar /tmp/tla2tools.jar -config ZigpropRunnerRatchetTight.cfg ZigpropRunner.tla \
            > /tmp/tlc-ratchet-tight.out 2>&1 || true
          cat /tmp/tlc-ratchet-tight.out
          grep -q "Error: Invariant AcceptsBelowMeasureBound is violated." /tmp/tlc-ratchet-tight.out
          if grep -q "Model checking completed. No error has been found." /tmp/tlc-ratchet-tight.out; then
            echo "ZigpropRunnerRatchetTight.cfg was expected to violate AcceptsBelowMeasureBound" >&2
            exit 1
          fi
