name: Benchmarks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bench/**"
      - "src/**"
      - "build.zig"
      - "build.zig.zon"
      - ".github/workflows/bench.yml"

permissions:
  contents: read

jobs:
  bench:
    name: full benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.1
      - name: Run benchmarks
        shell: bash
        run: |
          set -euo pipefail
          # Benchmark output is printed to stderr (std.debug.print).
          zig build bench 2>&1 | tee bench-output.txt
          grep -q "ns/op" bench-output.txt
      - name: Upload results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-output
          path: bench-output.txt
