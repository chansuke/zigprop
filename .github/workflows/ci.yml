name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (zig ${{ matrix.zig }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        zig: ["0.17.1"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ matrix.zig }}
      - name: Format check
        run: zig build fmt-check
      - name: Unit and meta tests
        run: zig build test --summary all
      - name: Lint (tools/lint; core-is-pure keeps the core from printing, design v0.3 §4.8, D26)
        run: zig build lint
      - name: Validation targets (T1-T9e)
        run: zig build validation
      - name: Benchmark harness (smoke)
        run: zig build bench -Dsmoke

  zig-master:
    name: early warning (zig master, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: master
      - name: Tests on master
        run: zig build test --summary all

  macos:
    name: test (macOS, zig 0.17.1)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.1
      - name: Format check
        run: zig build fmt-check
      - name: Unit and meta tests
        run: zig build test --summary all
