name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (zig ${{ matrix.zig }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        zig: ["0.17.1"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # pin-guard reads the base revision with git show
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ matrix.zig }}
      - name: Format check
        run: zig build fmt-check
      - name: Unit and meta tests
        run: zig build test --summary all
      - name: Lint (tools/lint; core-is-pure keeps the core from printing, design v0.3 §4.8, D26)
        run: zig build lint
      - name: Validation targets (T1-T14)
        run: zig build validation
      - name: Compile budget (fresh cache, 120 s limit; time is a measurement)
        # shell: bash adds -o pipefail, so tee does not hide a failed compile-budget.
        shell: bash
        run: zig build compile-budget --summary all 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Benchmark harness (smoke)
        run: zig build bench -Dsmoke
      # pin-guard needs a base revision, so it is the one step outside `zig build verify-full`.
      - name: Pin guard (golden-pin diff against the PR base)
        if: github.event_name == 'pull_request'
        run: zig build pin-guard -Dpin-base=origin/${{ github.base_ref }}
      - name: Pin guard (golden-pin diff against the previous commit)
        if: github.event_name == 'push'
        run: zig build pin-guard -Dpin-base=HEAD~1

  zig-master:
    name: early warning (zig master, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: master
      - name: Tests on master
        run: zig build test --summary all

  test-32bit:
    name: test (x86-linux, 32-bit usize, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.1
      - name: Unit and meta tests (x86-linux)
        run: zig build test -Dtarget=x86-linux --summary all

  macos:
    name: test (macOS, zig 0.17.1)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.1
      - name: Format check
        run: zig build fmt-check
      - name: Unit and meta tests
        run: zig build test --summary all
